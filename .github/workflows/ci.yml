name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Build and launch Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set Android Java API jar
        run: echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - uses: Swatinem/rust-cache@v2
      - name: Build ARM64 native library
        run: cargo ndk -t arm64-v8a -P 26 -o android-app/app/src/main/jniLibs build --release -p aaadaw --lib --features android-backend
      - name: Build x86_64 emulator library
        run: cargo ndk -t x86_64 -P 26 -o android-app/app/src/main/jniLibs build --release -p aaadaw --lib --features android-backend
      - name: Assemble debug APK
        run: gradle -p android-app assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aaadaw-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  android-emulator:
    name: Launch Android APK on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: aaadaw-android-debug
          path: android-apk
      - uses: android-actions/setup-android@v4.0.4
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          if [ -x "$ANDROID_HOME/emulator/emulator" ]; then
            "$ANDROID_HOME/emulator/emulator" -accel-check
          fi
      - name: Install screenshot OCR tool
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get install --no-install-recommends -y tesseract-ocr
          fi
      - name: Launch APK and verify rendered foreground activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: false
          script: |
            adb logcat -c
            timeout 180s sh -c 'attempt=0; while [ "$attempt" -lt 12 ]; do if adb shell cmd package list packages >/dev/null 2>&1 && adb install android-apk/app-debug.apk; then exit 0; fi; adb wait-for-device; sleep 5; attempt=$((attempt + 1)); done; exit 1'
            adb shell settings put system font_scale 1.3
            adb shell am force-stop org.aaadaw.app
            adb shell am start -n org.aaadaw.app/org.aaadaw.app.MainActivity
            timeout 120s sh -c 'attempt=0; while [ "$attempt" -lt 90 ]; do pid="$(adb shell pidof org.aaadaw.app 2>/dev/null | tr -d "[:space:]")"; case "$pid" in ""|*[!0-9]*) ;; *) exit 0 ;; esac; sleep 1; attempt=$((attempt + 1)); done; exit 1' || { sh scripts/dump_android_state.sh; exit 1; }
            sh scripts/wait_for_android_screenshot.sh || { adb logcat -d -v threadtime -b all > android-logcat.txt; sh scripts/dump_android_state.sh; exit 1; }
            adb shell run-as org.aaadaw.app test -d files/aaadaw/unsaved-sessions || { adb logcat -d -v threadtime -b all > android-logcat.txt; sh scripts/dump_android_state.sh; exit 1; }
            timeout 90s sh -c 'attempt=0; while [ "$attempt" -lt 30 ]; do if adb shell dumpsys window 2>/dev/null | grep -Eq "mCurrentFocus=Window.*org\\.aaadaw\\.app/org\\.aaadaw\\.app\\.MainActivity"; then exit 0; fi; sleep 1; attempt=$((attempt + 1)); done; exit 1' || { adb logcat -d -v threadtime -b all > android-logcat.txt; sh scripts/dump_android_state.sh; exit 1; }
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 5
            adb shell dumpsys window | grep -Eq "mCurrentFocus=Window.*org\\.aaadaw\\.app/org\\.aaadaw\\.app\\.MainActivity" || { adb logcat -d -v threadtime -b all > android-logcat.txt; sh scripts/dump_android_state.sh; exit 1; }
            adb shell settings put system user_rotation 0
            adb shell settings put system font_scale 1.0
            adb logcat -d -v threadtime -b all > android-logcat.txt
      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaadaw-android-emulator-screen
          path: |
            aaadaw-portrait.png
            android-logcat.txt
          if-no-files-found: warn

  macos:
    name: Check macOS CoreAudio workspace (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Check portable macOS workspace defaults
        run: cargo check --workspace --all-targets
      - name: Check macOS workspace with CoreAudio
        run: cargo check --workspace --all-targets --features aaadaw/coreaudio-backend
      - name: Test CoreAudio device enumeration recovery
        run: cargo nextest run -p aaadaw --features coreaudio-backend -E 'test(cpal_output_enumeration_failures_are_visible_and_clear_loading_state) | test(cpal_input_enumeration_failures_are_visible_and_clear_loading_state) | test(cpal_backend_setting_round_trips_with_the_native_platform_name) | test(coreaudio_name_parses_as_cpal_backend_across_platforms) | test(unknown_saved_backend_is_ignored_without_invalidating_other_settings) | test(legacy_wasapi_device_keys_remain_readable)'
      - name: Test CPAL backend policies
        run: cargo nextest run -p aaadaw-engine --features coreaudio-backend -E 'test(persisted_cpal_) | test(missing_selected_device_) | test(input_config_accepts_mono_or_stereo_) | test(mono_input_is_copied_)'

  windows:
    name: Check Windows workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test supervised CLAP helper process
        run: cargo nextest run -p aaadaw-engine --test clap_helper_process
      - name: Check Windows WASAPI backend
        run: cargo check --workspace --all-targets --features aaadaw/wasapi-backend
      - name: Test WASAPI device enumeration error state
        run: cargo test -p aaadaw --features wasapi-backend cpal_output_enumeration_failures_are_visible_and_clear_loading_state
      - name: Test WASAPI input device enumeration error state
        run: cargo test -p aaadaw --features wasapi-backend cpal_input_enumeration_failures_are_visible_and_clear_loading_state
      - name: Test Windows WASAPI backend policies
        run: cargo test -p aaadaw-engine --features wasapi-backend

  rust:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Audit dependency licenses for supported targets
        run: cargo deny check licenses
      - uses: taiki-e/install-action@nextest
      - name: Install native audio development headers
        run: sudo apt-get update && sudo apt-get install --yes libglib2.0-dev libjack-jackd2-dev libpipewire-0.3-dev xvfb
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Linux JACK backend
        run: cargo check --workspace --all-targets --features aaadaw/jack-backend
      - name: Check Linux PipeWire backend
        run: cargo check --workspace --all-targets --features aaadaw/pipewire-backend
      - name: Test persisted playback backend selection
        run: cargo test -p aaadaw --features jack-backend,pipewire-backend saved_playback_backend_restores_only_when_available_in_this_build
      - name: Test PipeWire capture timing
        run: xvfb-run -a cargo nextest run -p aaadaw-engine --features pipewire-backend
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests with nextest
        run: xvfb-run -a cargo nextest run --workspace --features aaadaw/jack-backend --retries 2
