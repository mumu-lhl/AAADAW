name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Check Windows workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Check Windows WASAPI backend
        run: cargo check --workspace --all-targets --features aaadaw/wasapi-backend
      - name: Test Windows WASAPI backend policies
        run: cargo test -p aaadaw-engine --features wasapi-backend

  rust:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - name: Install native audio development headers
        run: sudo apt-get update && sudo apt-get install --yes libjack-jackd2-dev libpipewire-0.3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Linux JACK backend
        run: cargo check --workspace --all-targets --features aaadaw/jack-backend
      - name: Check Linux PipeWire backend
        run: cargo check --workspace --all-targets --features aaadaw/pipewire-backend
      - name: Test PipeWire capture timing
        run: cargo nextest run -p aaadaw-engine --features pipewire-backend
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests with nextest
        run: cargo nextest run --workspace --features aaadaw/jack-backend
