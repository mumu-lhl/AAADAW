[package]
name = "aaadaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A desktop digital audio workstation for recording, editing, and mixing audio and MIDI."

[features]
audio-device = ["aaadaw-app/audio-device"]
jack-backend = ["audio-device", "aaadaw-app/jack-backend"]
pipewire-backend = ["audio-device", "aaadaw-app/pipewire-backend"]
wasapi-backend = ["audio-device", "aaadaw-app/wasapi-backend"]
coreaudio-backend = ["audio-device", "aaadaw-app/coreaudio-backend"]
cpal-backend = ["audio-device", "aaadaw-app/cpal-backend"]

[dependencies]
aaadaw-core = { path = "../aaadaw-core" }
aaadaw-app = { path = "../aaadaw-app" }
aaadaw-media = { path = "../aaadaw-media" }
aaadaw-storage = { path = "../aaadaw-storage" }
aaadaw-engine = { path = "../aaadaw-engine" }
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "canvas", "advanced", "x11", "wayland", "tokio", "linux-theme-detection"] }
bytemuck = { version = "1.24", features = ["derive"] }
x11rb = "0.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
iced_winit = { version = "0.14.1", default-features = false, features = ["x11", "wayland"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
directories = "6.0.0"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15.4"

[package.metadata.deb]
maintainer = "AAADAW contributors"
copyright = "2026, AAADAW contributors"
license-file = ["../../LICENSE-MIT", "0"]
assets = [
    ["target/release/aaadaw", "usr/bin/aaadaw", "755"],
    ["../../packaging/linux/aaadaw.desktop", "usr/share/applications/aaadaw.desktop", "644"],
    ["../../docs/native-installers.md", "usr/share/doc/aaadaw/README.Debian", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/aaadaw/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/aaadaw/LICENSE-APACHE", "644"],
]
depends = ["$auto", "libjack-jackd2-0"]
section = "sound"
priority = "optional"
extended-description = "AAADAW is a desktop digital audio workstation for recording, editing, and mixing audio and MIDI."

[dev-dependencies]
rmcp = { version = "3.5.0", default-features = false, features = ["client", "server", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
