[package]
name = "aaadaw-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
audio-device = []
jack-backend = ["audio-device", "dep:jack"]
pipewire-backend = ["audio-device", "dep:pipewire"]
wasapi-backend = ["cpal-backend"]
coreaudio-backend = ["cpal-backend"]
cpal-backend = ["audio-device", "dep:cpal"]

[dependencies]
aaadaw-core = { path = "../aaadaw-core" }
clack-host = "0.2.0"
clack-extensions = { version = "0.2.0", default-features = false, features = ["audio-ports", "clack-host", "gui", "note-ports", "params", "posix-fd", "state", "tail"] }
jack = { version = "0.13.5", optional = true }
pipewire = { version = "0.10", optional = true }
rtrb = "0.4.0"
memmap2 = "0.9.9"
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18.2", optional = true }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.18.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.21"

[[bin]]
name = "aaadaw-engine-test-helper"
path = "tests/support/fake_clap_helper.rs"
test = false
bench = false

[dev-dependencies]
clack-common = "0.2.0"
clack-host = { version = "0.2.0", features = ["clack-plugin"] }
clack-extensions = { version = "0.2.0", default-features = false, features = ["audio-ports", "clack-plugin", "note-ports", "params", "state"] }
clack-plugin = "0.2.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13.2"

[[bench]]
name = "render_callback"
harness = false
