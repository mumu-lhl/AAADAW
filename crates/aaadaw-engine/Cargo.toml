[package]
name = "aaadaw-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
audio-device = []
jack-backend = ["audio-device", "dep:jack"]
pipewire-backend = ["audio-device", "dep:pipewire"]
wasapi-backend = ["audio-device", "dep:cpal"]

[dependencies]
aaadaw-core = { path = "../aaadaw-core" }
clack-host = "0.2.0"
clack-extensions = { version = "0.2.0", default-features = false, features = ["audio-ports", "clack-host", "gui", "note-ports", "params", "state"] }
jack = { version = "0.13.5", optional = true }
pipewire = { version = "0.10", optional = true }
rtrb = "0.4.0"
memmap2 = "0.9.9"
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18.2", optional = true }

[dev-dependencies]
clack-common = "0.2.0"
clack-host = { version = "0.2.0", features = ["clack-plugin"] }
clack-extensions = { version = "0.2.0", default-features = false, features = ["audio-ports", "clack-plugin", "note-ports", "params", "state"] }
clack-plugin = "0.2.0"

[[bench]]
name = "render_callback"
harness = false
